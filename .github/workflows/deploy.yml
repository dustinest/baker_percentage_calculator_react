name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to Deno Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build
        run: deno task build
      - name: Deploy
        uses: denoland/deployctl@v1
        with:
          project: YOUR_PROJECT_NAME
          entrypoint: _fresh/server.js
